name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, tests, installateur
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck
        run: shellcheck --severity=warning install.sh test/test-e2e.sh scripts/iris-ask scripts/iris-update

      - name: Python (compilation)
        run: python3 -I -m py_compile scripts/assistant.py scripts/iris-watch.py scripts/organize.py scripts/iris-doctor scripts/i18n.py test/test-update-button.py test/test-actions.py test/test-agent.py test/test-security.py test/test-search.py scripts/iris-remind test/test-remind.py test/test-image.py test/test-agent-switch.py test/test-model-link.py test/test-usage.py

      - name: Test du backend « agent au choix »
        run: python3 -I test/test-agent.py

      - name: Garde-fous de sécurité
        run: python3 -I test/test-security.py

      - name: Recherche dans l'historique
        run: python3 -I test/test-search.py

      - name: Rappels
        run: python3 -I test/test-remind.py

      - name: Collage d'images
        run: python3 -I test/test-image.py

      - name: Changement d'agent
        run: python3 -I test/test-agent-switch.py

      - name: Modèle par API (faux serveur local)
        run: python3 -I test/test-model-link.py

      - name: Jauges de quota
        run: python3 -I test/test-usage.py

      - name: Test de bout en bout (sans fenêtre, sans compte Claude)
        run: test/test-e2e.sh --no-gui

  secrets:
    name: Scan de secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Sur une pull request, Gitleaks liste ses commits via l'API : il lui faut
    # pull-requests: read (sans ça, 403 « Resource not accessible »).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tout l'historique, pas seulement le dernier commit
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
